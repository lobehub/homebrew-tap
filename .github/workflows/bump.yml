name: Bump

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [desktop-release, cli-release]

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump cask & formula to upstream latest
        id: bump
        run: ./scripts/bump.sh

      - name: Commit
        if: steps.bump.outputs.changed == '1'
        run: |
          git config user.name "lobehub-bot"
          git config user.email "bot@lobehub.com"
          git add -A
          git commit -m "chore: bump to upstream latest"
          git push
