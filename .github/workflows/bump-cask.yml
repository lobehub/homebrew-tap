name: Bump cask

on:
  workflow_dispatch:
    inputs:
      cask:
        description: Cask token (lobehub | lobehub@canary)
        required: true
        type: string
        default: lobehub
      version:
        description: Version without leading v
        required: true
        type: string
      mode:
        description: 'pr (open PR) | push (commit to main directly)'
        required: false
        type: choice
        options: [pr, push]
        default: pr
  repository_dispatch:
    types: [bump-cask]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: in
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            cask="${{ github.event.client_payload.cask }}"
            version="${{ github.event.client_payload.version }}"
            mode="${{ github.event.client_payload.mode }}"
          else
            cask="${{ inputs.cask }}"
            version="${{ inputs.version }}"
            mode="${{ inputs.mode }}"
          fi
          version="${version#v}"
          mode="${mode:-pr}"
          echo "cask=$cask"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode"       >> "$GITHUB_OUTPUT"

      - name: Compute sha256
        id: sha
        run: |
          v="${{ steps.in.outputs.version }}"
          base="https://github.com/lobehub/lobehub/releases/download/v${v}"
          arm=$(curl -fsSL "${base}/LobeHub-${v}-arm64.dmg" | shasum -a 256 | awk '{print $1}')
          x64=$(curl -fsSL "${base}/LobeHub-${v}-x64.dmg"   | shasum -a 256 | awk '{print $1}')
          test -n "$arm" && test -n "$x64"
          echo "arm=$arm" >> "$GITHUB_OUTPUT"
          echo "x64=$x64" >> "$GITHUB_OUTPUT"

      - name: Patch cask
        run: |
          file="Casks/${{ steps.in.outputs.cask }}.rb"
          v="${{ steps.in.outputs.version }}"
          arm="${{ steps.sha.outputs.arm }}"
          x64="${{ steps.sha.outputs.x64 }}"
          test -f "$file" || { echo "::error::cask file not found: $file"; exit 1; }
          /usr/bin/sed -i '' -E \
            -e "s/^  version \"[^\"]*\"$/  version \"${v}\"/" \
            -e "s/^         arm:   \"[^\"]*\",$/         arm:   \"${arm}\",/" \
            -e "s/^         intel: \"[^\"]*\"$/         intel: \"${x64}\"/" \
            "$file"
          git --no-pager diff "$file"

      - name: Push to main
        if: steps.in.outputs.mode == 'push'
        env:
          GIT_AUTHOR_NAME: lobehub-bot
          GIT_AUTHOR_EMAIL: bot@lobehub.com
          GIT_COMMITTER_NAME: lobehub-bot
          GIT_COMMITTER_EMAIL: bot@lobehub.com
        run: |
          file="Casks/${{ steps.in.outputs.cask }}.rb"
          if git diff --quiet -- "$file"; then
            echo "No changes."
            exit 0
          fi
          git add "$file"
          git commit -m "bump ${{ steps.in.outputs.cask }} to ${{ steps.in.outputs.version }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1

      - uses: peter-evans/create-pull-request@v6
        if: steps.in.outputs.mode == 'pr'
        with:
          commit-message: "bump ${{ steps.in.outputs.cask }} to ${{ steps.in.outputs.version }}"
          branch: bump/${{ steps.in.outputs.cask }}-${{ steps.in.outputs.version }}
          title: "bump ${{ steps.in.outputs.cask }} to ${{ steps.in.outputs.version }}"
          body: |
            Auto bump.
            - cask: `${{ steps.in.outputs.cask }}`
            - version: `${{ steps.in.outputs.version }}`
            - arm64 sha256: `${{ steps.sha.outputs.arm }}`
            - x64 sha256:   `${{ steps.sha.outputs.x64 }}`
