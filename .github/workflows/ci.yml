name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tap this repo
        run: |
          brew untap lobehub/tap --force || true
          brew tap lobehub/tap "$GITHUB_WORKSPACE"
          brew trust lobehub/tap || true

      - name: Style
        run: brew style lobehub/tap

      - name: Audit stable cask
        run: brew audit --cask --online lobehub/tap/lobehub

      # canary 基于 GitHub prerelease，--online 的 prerelease 检查必然会报错，
      # 这里只做离线 audit，再用 fetch 校验 dmg 的 SHA-256。
      - name: Audit canary cask
        run: brew audit --cask lobehub/tap/lobehub@canary

      - name: Audit formula
        run: brew audit --formula --online lobehub/tap/lobehub-cli

      - name: Verify checksums
        run: |
          brew fetch --cask lobehub/tap/lobehub
          brew fetch --cask lobehub/tap/lobehub@canary
